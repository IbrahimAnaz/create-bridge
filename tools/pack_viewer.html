<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Bedrock Pack 3D Visualizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121316;
      color: #e1e4ea;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 320px;
      background: #18191e;
      border-right: 1px solid #282a36;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #282a36;
      background: #1f2027;
    }
    #sidebar-header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #ff9f43;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #search-box {
      margin-top: 10px;
      width: 100%;
      padding: 8px 12px;
      background: #121316;
      border: 1px solid #333644;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    #search-box:focus { border-color: #ff9f43; }
    #filter-bar {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .filter-btn {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      background: #232530;
      border: 1px solid #333644;
      color: #aaa;
      cursor: pointer;
    }
    .filter-btn.active {
      background: #ff9f43;
      color: #121316;
      font-weight: 600;
      border-color: #ff9f43;
    }
    #block-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .block-item {
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 13px;
      background: #1a1b22;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .block-item:hover { background: #242631; }
    .block-item.selected {
      background: #2c2f3e;
      border-color: #ff9f43;
      color: #fff;
    }
    .badge-geo {
      background: #10ac84;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge-cube {
      background: #576574;
      color: #eee;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #main-viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #1e2029 0%, #0e0f12 100%);
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    #toolbar {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(24, 25, 30, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #333644;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 10;
    }
    .tool-btn {
      background: #232530;
      border: 1px solid #3d4153;
      color: #e1e4ea;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }
    .tool-btn:hover { background: #333644; }
    .tool-btn.active {
      background: #ff9f43;
      color: #121316;
      border-color: #ff9f43;
    }
    #info-panel {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 320px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: rgba(24, 25, 30, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid #333644;
      border-radius: 8px;
      padding: 16px;
      font-size: 12px;
      z-index: 10;
    }
    #info-panel h2 {
      font-size: 14px;
      margin-bottom: 8px;
      color: #ff9f43;
      word-break: break-all;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #232530;
    }
    .info-label { color: #888e9f; }
    .info-val { color: #fff; font-family: monospace; font-size: 11px; text-align: right; }
    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      color: #888e9f;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>⚙️ Create Pack Visualizer</h1>
      <input type="text" id="search-box" placeholder="Search blocks / models...">
      <div id="filter-bar">
        <button class="filter-btn active" id="filter-all">All (644)</button>
        <button class="filter-btn" id="filter-geo">3D Geo (63)</button>
        <button class="filter-btn" id="filter-cube">Cubes</button>
      </div>
    </div>
    <div id="block-list"></div>
  </div>

  <div id="main-viewport">
    <div id="toolbar">
      <button class="tool-btn" id="btn-wireframe">Wireframe</button>
      <button class="tool-btn active" id="btn-autorotate">Auto Rotate</button>
      <button class="tool-btn" id="btn-reset">Reset Camera</button>
      <button class="tool-btn" id="btn-grid">Toggle Grid</button>
    </div>
    <div id="canvas-container"></div>
    <div id="status-overlay">Loading pack metadata...</div>
    <div id="info-panel" style="display: none;">
      <h2 id="info-name">Block Name</h2>
      <div class="info-row"><span class="info-label">Java ID:</span><span class="info-val" id="info-java-id">-</span></div>
      <div class="info-row"><span class="info-label">Bedrock ID:</span><span class="info-val" id="info-bedrock-id">-</span></div>
      <div class="info-row"><span class="info-label">Geometry:</span><span class="info-val" id="info-geo-id">None</span></div>
      <div class="info-row"><span class="info-label">Texture Key:</span><span class="info-val" id="info-tex-key">-</span></div>
      <div class="info-row"><span class="info-label">Cubes Count:</span><span class="info-val" id="info-cubes-count">-</span></div>
      
      <!-- Blockstates & Variants Section -->
      <div id="blockstate-box" style="margin-top: 14px; border-top: 1px solid #333644; padding-top: 10px;">
        <div style="font-weight: 600; color: #ff9f43; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
          <span>Blockstates & Variants</span>
          <span id="bs-count" style="color: #888; font-size: 11px; font-weight: normal;">0 states</span>
        </div>
        <select id="bs-select" style="width: 100%; background: #121316; border: 1px solid #3d4153; color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 11px; outline: none; margin-bottom: 8px; cursor: pointer;"></select>
        <div id="bs-details" style="background: #121316; border: 1px solid #232530; border-radius: 4px; padding: 8px; font-size: 11px; line-height: 1.5; color: #a4b0be; max-height: 160px; overflow-y: auto;">
          <div style="color: #666; font-style: italic;">Select a block to inspect blockstates</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls, gridHelper;
    let currentModelGroup = null;
    let allBlocks = [];
    let currentFilter = 'all';
    let wireframeMode = false;
    let autoRotate = true;
    let showGrid = true;
    const textureLoader = new THREE.TextureLoader();
    const textureCache = {};

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(24, 20, 28);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 8, 0);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight1.position.set(20, 40, 20);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
      dirLight2.position.set(-20, -20, -20);
      scene.add(dirLight2);

      // Grid
      gridHelper = new THREE.GridHelper(32, 32, 0xff9f43, 0x333644);
      gridHelper.position.y = 0;
      scene.add(gridHelper);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (autoRotate && currentModelGroup) {
        currentModelGroup.rotation.y += 0.008;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    function loadTexture(path) {
      if (!path) return null;
      if (textureCache[path]) return textureCache[path];
      const tex = textureLoader.load(path);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      textureCache[path] = tex;
      return tex;
    }

    async function loadBlockData() {
      try {
        const res = await fetch('/api/blocks');
        allBlocks = await res.json();
        document.getElementById('status-overlay').style.display = 'none';

        const geoCount = allBlocks.filter(b => b.isGeo).length;
        document.getElementById('filter-all').innerText = `All (${allBlocks.length})`;
        document.getElementById('filter-geo').innerText = `3D Geo (${geoCount})`;

        renderBlockList();
        if (allBlocks.length > 0) {
          selectBlock(allBlocks[0]);
        }
      } catch (err) {
        document.getElementById('status-overlay').innerText = 'Failed to load block metadata: ' + err.message;
      }
    }

    function renderBlockList() {
      const listContainer = document.getElementById('block-list');
      listContainer.innerHTML = '';
      const searchTerm = document.getElementById('search-box').value.toLowerCase();

      const filtered = allBlocks.filter(b => {
        if (currentFilter === 'geo' && !b.isGeo) return false;
        if (currentFilter === 'cube' && b.isGeo) return false;
        if (searchTerm && !b.name.toLowerCase().includes(searchTerm) && !b.id.toLowerCase().includes(searchTerm)) return false;
        return true;
      });

      filtered.forEach(block => {
        const item = document.createElement('div');
        item.className = 'block-item';
        item.id = 'item-' + block.name;

        const nameSpan = document.createElement('span');
        nameSpan.innerText = block.name;

        const badge = document.createElement('span');
        badge.className = block.isGeo ? 'badge-geo' : 'badge-cube';
        badge.innerText = block.isGeo ? '3D GEO' : 'CUBE';

        item.appendChild(nameSpan);
        item.appendChild(badge);
        item.onclick = () => selectBlock(block);
        listContainer.appendChild(item);
      });
    }

    async function selectBlock(block) {
      document.querySelectorAll('.block-item').forEach(el => el.classList.remove('selected'));
      const activeEl = document.getElementById('item-' + block.name);
      if (activeEl) activeEl.classList.add('selected');

      document.getElementById('info-panel').style.display = 'block';
      document.getElementById('info-name').innerText = block.name;
      document.getElementById('info-java-id').innerText = block.id + ' (' + (block.rawIds ? block.rawIds.join(', ') : 'N/A') + ')';
      document.getElementById('info-bedrock-id').innerText = block.id;
      document.getElementById('info-geo-id').innerText = block.geoId || 'geometry.full_block (Unit Cube)';
      document.getElementById('info-tex-key').innerText = block.textureKey;

      if (currentModelGroup) {
        scene.remove(currentModelGroup);
        currentModelGroup = null;
      }

      const group = new THREE.Group();
      let cubeCount = 0;

      const texture = loadTexture(block.texturePath);
      const mat = new THREE.MeshStandardMaterial({
        map: texture,
        wireframe: wireframeMode,
        roughness: 0.8,
        metalness: 0.1,
        transparent: true,
        alphaTest: 0.1,
        side: THREE.DoubleSide
      });

      if (block.isGeo && block.geoFile) {
        try {
          const res = await fetch(block.geoFile);
          const geoJson = await res.json();
          const geoArray = geoJson['minecraft:geometry'] || [];
          if (geoArray.length > 0) {
            const geoDesc = geoArray[0].description || {};
            const texW = geoDesc.texture_width || 16;
            const texH = geoDesc.texture_height || 16;
            const bones = geoArray[0].bones || [];

            const faceOrder = ['east', 'west', 'up', 'down', 'south', 'north'];

            bones.forEach(bone => {
              if (bone.cubes) {
                bone.cubes.forEach(c => {
                  cubeCount++;
                  const size = c.size || [16, 16, 16];
                  const origin = c.origin || [-8, 0, -8];

                  const geom = new THREE.BoxGeometry(size[0], size[1], size[2]);

                  if (c.uv && typeof c.uv === 'object' && !Array.isArray(c.uv)) {
                    const uvAttr = geom.attributes.uv;
                    for (let f = 0; f < 6; f++) {
                      const faceKey = faceOrder[f];
                      const faceData = c.uv[faceKey];
                      if (faceData && faceData.uv && faceData.uv_size) {
                        const uMin = faceData.uv[0] / texW;
                        const vMax = 1.0 - (faceData.uv[1] / texH);
                        const uMax = (faceData.uv[0] + faceData.uv_size[0]) / texW;
                        const vMin = 1.0 - ((faceData.uv[1] + faceData.uv_size[1]) / texH);

                        const idx = f * 4;
                        uvAttr.setXY(idx + 0, uMin, vMax);
                        uvAttr.setXY(idx + 1, uMax, vMax);
                        uvAttr.setXY(idx + 2, uMin, vMin);
                        uvAttr.setXY(idx + 3, uMax, vMin);
                      }
                    }
                    uvAttr.needsUpdate = true;
                  }

                  const mesh = new THREE.Mesh(geom, mat);
                  mesh.position.set(origin[0] + size[0] / 2, origin[1] + size[1] / 2, origin[2] + size[2] / 2);
                  group.add(mesh);
                });
              }
            });
          }
        } catch (e) {
          console.error('Failed to parse geo JSON:', e);
        }
      }

      if (cubeCount === 0) {
        cubeCount = 1;
        const geom = new THREE.BoxGeometry(16, 16, 16);
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(0, 8, 0);
        group.add(mesh);
      }

      document.getElementById('info-cubes-count').innerText = cubeCount;
      currentModelGroup = group;
      scene.add(currentModelGroup);

      // Load and display blockstates / variants
      loadBlockstateDetails(block, group);
    }

    async function loadBlockstateDetails(block, targetGroup) {
      const bsSelect = document.getElementById('bs-select');
      const bsDetails = document.getElementById('bs-details');
      const bsCount = document.getElementById('bs-count');

      bsSelect.innerHTML = '<option value="">Loading states...</option>';
      bsDetails.innerHTML = '<div style="color: #888;">Fetching blockstates from JAR...</div>';

      try {
        const res = await fetch('/api/blockstate?name=' + encodeURIComponent(block.name));
        const data = await res.json();

        const variants = data.variants || [];
        const multipart = data.multipart || [];
        const total = variants.length || multipart.length;

        bsCount.innerText = total + (multipart.length ? ' multipart parts' : ' states');
        bsSelect.innerHTML = '';

        if (variants.length > 0) {
          variants.forEach((v, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = v.variant || 'default';
            bsSelect.appendChild(opt);
          });

          function showVariant(v) {
            let html = '';
            html += `<div style="margin-bottom: 4px;"><span style="color:#ff9f43; font-weight:600;">Model:</span> <span style="color:#fff;">${v.model || 'N/A'}</span></div>`;
            if (v.x || v.y) {
              html += `<div style="margin-bottom: 4px;"><span style="color:#10ac84; font-weight:600;">Rotation:</span> X=${v.x || 0}°, Y=${v.y || 0}° (uvlock=${v.uvlock || false})</div>`;
            }
            if (v.properties && Object.keys(v.properties).length > 0) {
              html += `<div style="color:#888e9f; font-weight:600; margin-top:4px; margin-bottom:2px;">Properties:</div>`;
              for (const [pk, pv] of Object.entries(v.properties)) {
                html += `<div>• <span style="color:#54a0ff;">${pk}</span> = <span style="color:#fff;">${pv}</span></div>`;
              }
            }
            bsDetails.innerHTML = html;

            if (targetGroup) {
              targetGroup.rotation.x = THREE.MathUtils.degToRad(- (v.x || 0));
              targetGroup.rotation.y = THREE.MathUtils.degToRad(- (v.y || 0));
            }
          }

          bsSelect.onchange = () => {
            const selected = variants[parseInt(bsSelect.value)];
            if (selected) showVariant(selected);
          };

          showVariant(variants[0]);

        } else if (multipart.length > 0) {
          multipart.forEach((part, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = 'Part ' + (idx + 1) + (part.when ? ' (conditional)' : ' (unconditional)');
            bsSelect.appendChild(opt);
          });

          function showMultipart(p) {
            let html = `<div style="color:#ff9f43; font-weight:600; margin-bottom:4px;">Multipart Definition:</div>`;
            if (p.when) {
              html += `<div style="margin-bottom: 4px;"><span style="color:#10ac84;">When:</span> <pre style="display:inline; color:#fff;">${JSON.stringify(p.when)}</pre></div>`;
            }
            if (p.apply) {
              const applyList = Array.isArray(p.apply) ? p.apply : [p.apply];
              applyList.forEach(a => {
                html += `<div><span style="color:#54a0ff;">Model:</span> ${a.model || 'N/A'} (Y=${a.y||0}°, X=${a.x||0}°)</div>`;
              });
            }
            bsDetails.innerHTML = html;
          }

          bsSelect.onchange = () => {
            const selected = multipart[parseInt(bsSelect.value)];
            if (selected) showMultipart(selected);
          };

          showMultipart(multipart[0]);

        } else {
          bsCount.innerText = '1 default state';
          bsSelect.innerHTML = '<option value="">default</option>';
          bsDetails.innerHTML = `<div style="color:#888;">Single default state. No property variants defined.</div>`;
        }

      } catch (err) {
        bsCount.innerText = 'Error';
        bsDetails.innerHTML = `<div style="color:#ff6b6b;">Failed to load blockstates: ${err.message}</div>`;
      }
    }

    // Controls setup
    document.getElementById('search-box').addEventListener('input', renderBlockList);

    document.getElementById('filter-all').onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('filter-all').classList.add('active');
      currentFilter = 'all';
      renderBlockList();
    };

    document.getElementById('filter-geo').onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('filter-geo').classList.add('active');
      currentFilter = 'geo';
      renderBlockList();
    };

    document.getElementById('filter-cube').onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('filter-cube').classList.add('active');
      currentFilter = 'cube';
      renderBlockList();
    };

    document.getElementById('btn-wireframe').onclick = () => {
      wireframeMode = !wireframeMode;
      document.getElementById('btn-wireframe').classList.toggle('active', wireframeMode);
      if (currentModelGroup) {
        currentModelGroup.traverse(child => {
          if (child.isMesh) child.material.wireframe = wireframeMode;
        });
      }
    };

    document.getElementById('btn-autorotate').onclick = () => {
      autoRotate = !autoRotate;
      document.getElementById('btn-autorotate').classList.toggle('active', autoRotate);
    };

    document.getElementById('btn-reset').onclick = () => {
      camera.position.set(24, 20, 28);
      controls.target.set(0, 8, 0);
      if (currentModelGroup) currentModelGroup.rotation.y = 0;
    };

    document.getElementById('btn-grid').onclick = () => {
      showGrid = !showGrid;
      gridHelper.visible = showGrid;
      document.getElementById('btn-grid').classList.toggle('active', showGrid);
    };

    init3D();
    loadBlockData();
  </script>
</body>
</html>
